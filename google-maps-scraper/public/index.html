<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Maps Scraper — Business Data Extractor</title>
  <meta name="description" content="Extract business data from Google Maps — names, phones, addresses, websites. Export to CSV." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ─── Animated Background ─── -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <!-- ─── Main App ─── -->
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header__logo">
        <div class="header__icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div>
          <h1 class="header__title">Maps Scraper</h1>
          <p class="header__subtitle">Business Data Extractor</p>
        </div>
      </div>
      <div class="header__stats" id="headerStats">
        <div class="stat-pill">
          <span class="stat-pill__label">Found</span>
          <span class="stat-pill__value" id="statFound">0</span>
        </div>
        <div class="stat-pill">
          <span class="stat-pill__label">Detailed</span>
          <span class="stat-pill__value" id="statDetailed">0</span>
        </div>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <div class="search-card">
        <div class="search-card__header">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span>Search Businesses</span>
        </div>
        <div class="search-card__body">
          <div class="input-group">
            <label for="searchQuery" class="input-label">Search Query</label>
            <input type="text" id="searchQuery" class="input-field" placeholder='e.g. "restaurants in Dubai" or "dentists in New York"' />
          </div>
          <div class="search-actions">
            <button id="btnSearch" class="btn btn--primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              Search
            </button>
            <button id="btnLoadMore" class="btn btn--secondary" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
              </svg>
              Load More
            </button>
            <button id="btnFetchDetails" class="btn btn--accent" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
              </svg>
              Fetch All Details
            </button>
            <button id="btnExportCSV" class="btn btn--success" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Export CSV
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Progress Bar -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar">
        <div class="progress-bar__fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText">Fetching details...</p>
    </div>

    <!-- Status Messages -->
    <div id="statusMessage" class="status-message"></div>

    <!-- Filter Bar -->
    <section class="filter-section" id="filterSection">
      <div class="filter-card">
        <div class="filter-card__header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
          </svg>
          <span>Smart Filters</span>
        </div>
        <div class="filter-card__body">
          <button class="filter-chip active" data-filter="all" id="filterAll">
            <span class="filter-chip__dot"></span>
            All Results
            <span class="filter-chip__count" id="countAll">0</span>
          </button>
          <button class="filter-chip" data-filter="no-website" id="filterNoWebsite">
            <span class="filter-chip__dot filter-chip__dot--rose"></span>
            No Website
            <span class="filter-chip__count" id="countNoWebsite">0</span>
          </button>
          <button class="filter-chip" data-filter="no-phone" id="filterNoPhone">
            <span class="filter-chip__dot filter-chip__dot--amber"></span>
            No Phone
            <span class="filter-chip__count" id="countNoPhone">0</span>
          </button>
          <button class="filter-chip" data-filter="has-website" id="filterHasWebsite">
            <span class="filter-chip__dot filter-chip__dot--emerald"></span>
            Has Website
            <span class="filter-chip__count" id="countHasWebsite">0</span>
          </button>
          <button class="filter-chip" data-filter="has-phone" id="filterHasPhone">
            <span class="filter-chip__dot filter-chip__dot--cyan"></span>
            Has Phone
            <span class="filter-chip__count" id="countHasPhone">0</span>
          </button>
          <button class="filter-chip" data-filter="low-rating" id="filterLowRating">
            <span class="filter-chip__dot filter-chip__dot--amber"></span>
            Rating &lt; 4★
            <span class="filter-chip__count" id="countLowRating">0</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Collection Bar -->
    <section class="collection-section" id="collectionSection">
      <div class="collection-card">
        <div class="collection-card__info">
          <div class="collection-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <div>
            <span class="collection-label">Collection</span>
            <span class="collection-count" id="collectionCount">0 businesses</span>
          </div>
        </div>
        <div class="collection-actions">
          <button id="btnAddToCollection" class="btn btn--accent btn--sm" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add to Collection
          </button>
          <button id="btnExportCollection" class="btn btn--success btn--sm" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Export All
          </button>
          <button id="btnClearCollection" class="btn btn--danger btn--sm" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            Clear
          </button>
        </div>
      </div>
    </section>

    <!-- Results Table -->
    <section class="results-section" id="resultsSection">
      <div class="table-card">
        <div class="table-card__header">
          <div class="table-card__title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
            <span>Results</span>
          </div>
          <span class="table-card__count" id="resultCount">0 businesses</span>
        </div>
        <div class="table-wrapper">
          <table class="data-table" id="dataTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Business Name</th>
                <th>Address</th>
                <th>Phone</th>
                <th>Website</th>
                <th>Rating</th>
                <th>Reviews</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr class="empty-row">
                <td colspan="8">
                  <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
                      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                    </svg>
                    <p>Search for businesses to see results here</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
